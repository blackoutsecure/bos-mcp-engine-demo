name: Generate and Deploy MCP Registry Demo to GitHub Pages

on:
  push:
    branches: [registry-demo-gh]
    paths:
      - "servers/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_URL: https://demo-gh.mcp.registry.blackoutsecure.dev
  OUTPUT_BASE_DIR: dist
  OUTPUT_PUBLIC_DIR: public
  LOG_LEVEL: debug
  COMMIT_GENERATED_ARTIFACTS: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate static MCP registry
        uses: blackoutsecure/bos-mcp-registry-engine@57d8774944c95eb0b073de4dd72217e715cd3c59 # latest (v1.0.18)
        with:
          action_type: generate_registry
          source: ./servers
          output_directory: ${{ env.OUTPUT_BASE_DIR }}
          output: ${{ env.OUTPUT_PUBLIC_DIR }}
          deployment_environment: github
          commit_generated_artifacts: ${{ env.COMMIT_GENERATED_ARTIFACTS }}
          log_level: ${{ env.LOG_LEVEL }}

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.OUTPUT_BASE_DIR }}/${{ env.OUTPUT_PUBLIC_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
